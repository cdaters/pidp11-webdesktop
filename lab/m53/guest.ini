; M5.3 disposable lab copy of the planned standalone Pi configuration.
; No REALCONS connection, GPIO, launcher or panel daemon.
detach all
reset all
set cpu 11/70 1M
set cpu idle
set rp0 rp06
attach rp0 /work/disk0.hp
set dci enabled
set dci lines=8
attach dci line=0,127.0.0.1:40100;notelnet
boot rp0
