; Disposable UNIX V7 instance, original pinned SIMH/REALCONS binary.
; No REALCONS connection or physical/GPIO access. Screen/operator PTY is independent.
set cpu 11/70 1M
set cpu idle
set rp0 rp06
attach rp0 /work/disk0.hp
set dci enabled
set dci lines=4
attach dci line=0,127.0.0.1:40100;notelnet
attach dci line=1,127.0.0.1:40101;notelnet
attach dci line=2,127.0.0.1:40102;notelnet
boot rp0
