<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
<title id="title">M5.28 isolated Ethernet laboratory</title><desc id="desc">Genuine 2.11BSD de0 communicates through SIMH XU DEUNA and an owned isolated TAP with an independent TCP peer. An optional passive collector produces retained evidence. There is no route to the Internet or production LAN.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#dce8df"/></marker></defs>
<rect width="1100" height="260" rx="12" fill="#19302c"/>
<g font-family="system-ui,sans-serif" fill="#f2f0e6" text-anchor="middle"><text x="550" y="34" font-size="21">Retained M5.28 evidence · isolated laboratory, not a live browser display</text>
<g fill="#354a43" stroke="#aabbad"><rect x="30" y="65" width="210" height="66" rx="6"/><rect x="295" y="65" width="230" height="66" rx="6"/><rect x="580" y="65" width="210" height="66" rx="6"/><rect x="845" y="65" width="225" height="66" rx="6"/><rect x="535" y="175" width="300" height="49" rx="6"/></g>
<g font-size="18"><text x="135" y="92">2.11BSD · de0</text><text x="135" y="116" font-size="15">Genuine guest TCP/IP</text><text x="410" y="92">SIMH · XU / DEUNA</text><text x="410" y="116" font-size="15">Separate original-source build</text><text x="685" y="92">Owned isolated TAP</text><text x="685" y="116" font-size="15">No default route or NAT</text><text x="957" y="92">Independent local peer</text><text x="957" y="116" font-size="15">Distinct request and reply</text><text x="685" y="196" font-size="16">Optional passive capture → summary</text><text x="685" y="215" font-size="14">Retained evidence; current state unknown</text></g>
<text x="270" y="202" font-size="16">Independent console remains available</text><text x="550" y="246" font-size="14">22 captured frames · 3/3 ping replies · 23-byte TCP request / 21-byte response · final fresh-copy run</text></g>
<g stroke="#dce8df" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M245 98 H288"/><path d="M530 98 H573"/><path d="M795 98 H838"/></g><path d="M685 136 V168" stroke="#dce8df" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
